<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Finanças</title>
  <meta name="theme-color" content="#0b6b57">
  <script>window.API_URL = "https://script.google.com/macros/s/AKfycbyQPTsc4Uy5WnHUy2whf_dra87FFHaDQalRuiTXPY8JKNHytdpqdad9uoVFnulR8Vh9Ew/exec";</script>
  <style>
/* Tokens — o Claude Design pode trocar tudo aqui sem mexer na lógica. */
:root{
  --bg:#f5f6f8; --surface:#fff; --surface2:#eef0f4; --text:#15181e; --muted:#667085; --line:#e3e6ec;
  --brand:#0b6b57; --brand-ink:#fff; --pos:#0b7a4b; --neg:#b42318; --warn:#b54708; --info:#175cd3;
  --radius:14px; --gap:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --nav-h:60px; --side-w:220px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--surface:#171a21;--surface2:#20242d;--text:#eceef3;--muted:#9aa3b2;--line:#2a2f3a;--brand:#2fbf9b;--brand-ink:#04251d;--pos:#4ade80;--neg:#f97066;--warn:#fdb022;--info:#84adff;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2} h1{font-size:20px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .right{text-align:right} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* layout: menu lateral no desktop, barra inferior no celular */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.side .brand{font-weight:700;font-size:17px;padding:4px 10px 14px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;color:var(--muted)}
.nav-btn .ico{width:22px;text-align:center}
.nav-btn.on{background:var(--surface2);color:var(--text);font-weight:600}
main{padding:20px 22px 90px;max-width:1100px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--gap);margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:var(--gap)} .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin-bottom:8px;color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:26px;font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{min-width:0} .item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted)}
.day{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 2px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--neg)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--surface2);color:var(--muted)}
.chip.bad{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)} .chip.ok{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)} .chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.alert{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);margin-bottom:var(--gap)}
.alert.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:40px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--neg)} .btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:20}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)} .seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:42px}
input[type=checkbox]{width:auto;min-height:0}
input.valor{font-size:26px;font-weight:700;text-align:right}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--gap)}

.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.modal.wide{max-width:820px}
.modal header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
.toast.err{background:var(--neg);color:#fff}
.chart{width:100%;height:150px} .chart path{fill:none;stroke:var(--brand);stroke-width:2} .chart circle{fill:var(--brand)} .chart text{fill:var(--muted);font-size:10px}
video.cam{width:100%;border-radius:12px;background:#000;max-height:50vh}
table.t{width:100%;border-collapse:collapse;font-size:13px} table.t th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)} table.t td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle} table.t td input,table.t td select{min-height:34px;padding:5px 7px}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}

@media (max-width:820px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:var(--nav-h);padding:0 4px env(safe-area-inset-bottom);flex-direction:row;border-right:0;border-top:1px solid var(--line);z-index:30;justify-content:space-around;gap:0}
  .side .brand{display:none}
  .nav-btn{flex-direction:column;gap:1px;justify-content:center;align-items:center;padding:4px 2px;font-size:11px;text-align:center;width:auto;flex:1}
  .nav-btn .ico{font-size:19px}
  main{padding:14px 14px 140px}
  .form2{grid-template-columns:1fr}
}
</style>

</head>
<body>
  <div class="app">
    <nav class="side" id="nav" aria-label="Principal"></nav>
    <main id="main" aria-live="polite"></main>
  </div>
  <button class="fab" id="fab" aria-label="Novo lançamento" title="Novo lançamento">+</button>
  <div id="modal-root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* ============================================================================
   Client.html — interface mínima (vanilla JS). Estrutura para o Claude Design refazer:
   - API ............. api(action, payload)   → única ponte com o servidor (Code.gs)
   - Estado .......... S
   - Telas ........... VIEWS.{inicio,lancamentos,agenda,compras,precos,cesta,estoque,mais}
   - Formulários ..... abrirLancamento, abrirPagar, abrirAgenda, abrirScanNota, abrirProduto, crudModal
   Fora do Apps Script (abrindo o Index.html direto no navegador) roda com dados de demonstração.
   ========================================================================== */
'use strict';

// ---------- util ----------
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (v) => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (n) => (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (v) => { if (typeof v === 'number') return v; let s = String(v || '').replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const dBR = (iso) => iso ? iso.substr(8, 2) + '/' + iso.substr(5, 2) + (iso.substr(0, 4) !== (S.boot ? S.boot.hoje.substr(0, 4) : '') ? '/' + iso.substr(2, 2) : '') : '';
const ym = (iso) => iso.substr(0, 7);
const pct = (n) => n === null || n === undefined ? '—' : (n > 0 ? '+' : '') + String(n).replace('.', ',') + '%';
const sinal = (l) => l.tipo === 'Entrada' ? 1 : (l.tipo === 'Saída' ? -1 : 0);

const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const S = { boot: null, view: 'inicio', mes: null, busca: '', dash: null, ws: '', espacos: [], email: '', tk: '' };
const guardar = (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } };
const lembrar = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };

function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2600);
}

// ---------- API ----------
function api(action, payload) {
  const corpo = Object.assign({ _ws: S.ws, _tk: S.tk }, payload || {});
  const resposta = (r) => { if (r && r.ok) return r.data; const er = new Error((r && r.error) || 'Erro desconhecido'); er.codigo = (r && r.codigo) || ''; throw er; };
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script) {          // aberto dentro do Apps Script
      google.script.run.withSuccessHandler((r) => { try { resolve(resposta(r)); } catch (e) { reject(e); } })
        .withFailureHandler((e) => reject(new Error(e && e.message ? e.message : String(e)))).api(action, corpo);
    } else if (window.API_URL) {                                    // site estático chamando o Apps Script como API (sem cookies do Google)
      fetch(window.API_URL, { method: 'POST', redirect: 'follow', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload: corpo }) })
        .then((r) => r.json()).then((r) => { try { resolve(resposta(r)); } catch (e) { reject(e); } })
        .catch((e) => reject(e && e.codigo !== undefined ? e : new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.')));
    } else resolve(demoApi(action, corpo));                          // prévia local com dados de demonstração
  });
}
async function run(fn) {
  try { return await fn(); }
  catch (e) {
    toast(e.message, true); console.error(e);
    if (e.codigo === 'CONFLITO') refresh();
    if (e.codigo === 'LOGIN') { S.tk = ''; guardar('fin_tk', ''); mostrarLogin(); }
    if (e.codigo === 'SEM_ESPACO') abrirEspacos();
  }
}

// ---------- modal ----------
function modal(html, opts) {
  opts = opts || {};
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  function close() { document.removeEventListener('keydown', onKey); if (opts.onClose) opts.onClose(); bg.remove(); }
  // duplo toque: bloqueia o botão principal por 1,5 s; a chave rid (mesma por formulário) garante que o servidor não repita o efeito
  bg.addEventListener('click', (e) => { const b = e.target.closest ? e.target.closest('button.primary') : null; if (b) setTimeout(() => { b.disabled = true; setTimeout(() => { b.disabled = false; }, 1500); }, 0); });
  $('#modal-root').appendChild(bg);
  const x = $('[data-close]', bg); if (x) x.onclick = close;
  return { el: bg.firstChild, close, rid: uuid() };
}
const optsHtml = (arr, sel, vk, lk, vazio) => (vazio ? '<option value="">' + esc(vazio) + '</option>' : '') + arr.map((o) => { const v = vk ? o[vk] : o, l = lk ? o[lk] : o; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');

// ---------- navegação ----------
const NAV = [['inicio', '🏠', 'Início'], ['lancamentos', '🧾', 'Lançamentos'], ['agenda', '📅', 'Contas'], ['compras', '🛒', 'Compras'], ['precos', '📈', 'Preços'], ['cesta', '🧺', 'Cesta'], ['estoque', '📦', 'Estoque'], ['mais', '⚙️', 'Mais']];
const podeEditar = () => !S.boot || !S.boot.me || S.boot.me.papel !== 'leitura';
const ehAdmin = () => !!(S.boot && S.boot.me && S.boot.me.papel === 'admin');
function renderNav() {
  $('#nav').innerHTML = '<div class="brand">💚 Finanças</div>' + NAV.map((n) => '<button class="nav-btn' + (S.view === n[0] ? ' on' : '') + '" data-v="' + n[0] + '"><span class="ico">' + n[1] + '</span><span>' + n[2] + '</span></button>').join('') +
    (S.boot && S.boot.me ? '<div class="muted me" style="margin-top:auto;padding:8px 10px;font-size:12px;word-break:break-all"><b>' + esc(S.boot.espaco ? S.boot.espaco.nome : '') + '</b><br>' + esc(S.boot.me.nome || S.boot.me.email) + ' · ' + esc(S.boot.me.papel) + '<br><button class="btn sm" id="b-trocar" style="margin-top:6px">Trocar espaço</button>' + (S.tk ? ' <button class="btn sm" id="b-sair" style="margin-top:6px">Sair</button>' : '') + '</div>' : '');
  $$('.nav-btn').forEach((b) => b.onclick = () => go(b.dataset.v));
  const tr = $('#b-trocar'); if (tr) tr.onclick = () => abrirEspacos();
  const so = $('#b-sair'); if (so) so.onclick = () => { S.tk = ''; S.boot = null; guardar('fin_tk', ''); guardar('fin_ws', ''); location.reload(); };
}
function go(v) { S.view = v; renderNav(); render(); window.scrollTo(0, 0); }
async function render() {
  const main = $('#main'); main.innerHTML = '<div class="empty">Carregando…</div>';
  await run(async () => { main.innerHTML = await VIEWS[S.view](); const after = AFTER[S.view]; if (after) after(); });
}
const refresh = () => render();
function bind(sel, ev, fn, root) { $$(sel, root || document).forEach((el) => el['on' + ev] = (e) => fn(el, e)); }

// ======================================================================= INÍCIO
const VIEWS = {};
const AFTER = {};

VIEWS.inicio = async () => {
  const d = S.preDash || await api('dashboard', { mes: S.mes }); S.preDash = null; S.dash = d;
  const lim = d.limite;
  const limHtml = lim ? '<div class="card"><h3>Limite da ' + esc(lim.conta) + '</h3><div class="big num">' + brl(lim.usado) + ' <span class="muted" style="font-size:14px">de ' + brl(lim.limite) + '</span></div>' +
    '<div class="bar ' + (lim.acima_alerta ? 'bad' : lim.pct > 75 ? 'warn' : '') + '"><i style="width:' + Math.min(100, lim.pct) + '%"></i></div>' +
    '<div class="s muted" style="margin-top:6px">Disponível ' + brl(lim.disponivel) + ' · alerta em ' + brl(lim.alerta) + '</div></div>' : '';
  const alerta = (lim && lim.acima_alerta) ? '<div class="alert bad"><b>Atenção:</b> limite usado acima de ' + brl(lim.alerta) + '. Estourar o teto vira atraso.</div>' : '';
  const atras = d.agenda.atrasados ? '<div class="alert"><b>' + d.agenda.atrasados + '</b> conta(s) vencida(s) na agenda.</div>' : '';
  const contas = d.contas.map((c) => '<div class="item"><div class="t"><b>' + esc(c.nome) + '</b></div><div class="num ' + (c.saldo < 0 ? 'neg' : '') + '">' + brl(c.saldo) + '</div></div>').join('');
  const cartoes = d.cartoes.map((c) => '<div class="item" data-card="' + esc(c.id) + '"><div class="t"><b>' + esc(c.nome) + '</b><div class="s">' + (c.faturas.length ? c.faturas.map((f) => 'vence ' + dBR(f.vence) + ' · ' + brl(f.aberto) + ' <span class="chip ' + (f.status === 'Vencida' ? 'bad' : '') + '">' + f.status + '</span>').join('<br>') : 'sem fatura em aberto') + '</div></div><div class="num ' + (c.deve ? 'neg' : '') + '">' + brl(c.deve) + '</div></div>').join('');
  const orc = d.orcamento.filter((o) => o.orcamento > 0 || o.realizado > 0).map((o) => '<div style="margin-bottom:10px"><div class="item" style="border:0;padding:0"><span>' + esc(o.categoria) + '</span><span class="num">' + brl(o.realizado) + (o.orcamento ? ' <span class="muted">/ ' + brl(o.orcamento) + '</span>' : '') + '</span></div>' + (o.orcamento ? '<div class="bar ' + (o.pct > 100 ? 'bad' : o.pct > 85 ? 'warn' : '') + '"><i style="width:' + Math.min(100, o.pct) + '%"></i></div>' : '') + '</div>').join('') || '<div class="empty">Defina orçamentos em Mais → Categorias.</div>';
  const prox = d.agenda.proximos.map((a) => '<div class="item" data-ag="' + esc(a.id) + '"><div class="t"><b>' + esc(a.descricao) + '</b><div class="s">' + dBR(a.vencimento) + (a.vencimento < d.hoje ? ' · <span class="neg">vencida</span>' : '') + '</div></div><div class="num ' + (a.direcao === 'Receber' ? 'pos' : '') + '">' + brl(a.valor) + '</div></div>').join('') || '<div class="empty">Nada pendente 🎉</div>';
  const est = d.estoque.map((e) => '<div class="item"><span>' + esc(e.nome) + '</span><span class="chip ' + (e.status === 'COMPRAR AGORA' ? 'bad' : 'warn') + '">' + (e.status === 'COMPRAR AGORA' ? 'comprar agora' : 'em ' + e.dias + ' d') + '</span></div>').join('');
  const preco = d.alertas_preco.map((a) => '<div class="item"><span>' + esc(a.nome) + '</span><span class="num ' + (a.pct > 0 ? 'neg' : 'pos') + '">' + pct(a.pct) + '</span></div>').join('');
  const ult = d.ultimos.map(itemLanc).join('');
  return '<div class="topbar"><h1>Início</h1><input type="month" id="mes" value="' + esc(d.mes) + '" style="width:auto"></div>' + alerta + atras +
    '<div class="grid g3">' +
      '<div class="card"><h3>Saldo líquido</h3><div class="big num ' + (d.saldo_liquido < 0 ? 'neg' : 'pos') + '">' + brl(d.saldo_liquido) + '</div><div class="s muted">contas − faturas de cartão</div></div>' +
      '<div class="card"><h3>Mês · entradas / saídas</h3><div class="num"><span class="pos">' + brl(d.mes_totais.entradas) + '</span> / <span class="neg">' + brl(d.mes_totais.saidas) + '</span></div><div class="s muted">resultado ' + brl(d.mes_totais.resultado) + '</div></div>' +
      '<div class="card"><h3>A pagar até o fim do mês</h3><div class="big num">' + brl(d.agenda.pagar_ate_fim_do_mes) + '</div><div class="s muted">a receber ' + brl(d.agenda.receber_ate_fim_do_mes) + '</div></div>' +
    '</div><div class="grid g2" style="margin-top:12px">' + limHtml +
      '<div class="card"><h3>Dívida total</h3><div class="big num neg">' + brl(d.dividas.total_geral) + '</div><div class="s muted">' + esc(d.dividas.observacao) + '</div></div>' +
      '<div class="card"><h3>Contas</h3><div class="list">' + contas + '</div></div>' +
      '<div class="card"><h3>Cartões</h3><div class="list">' + (cartoes || '<div class="empty">Nenhum cartão</div>') + '</div></div>' +
      '<div class="card"><h3>Próximos vencimentos</h3><div class="list">' + prox + '</div></div>' +
      '<div class="card"><h3>Orçamento do mês</h3>' + orc + '</div>' +
      (est ? '<div class="card"><h3>Estoque: comprar</h3><div class="list">' + est + '</div></div>' : '') +
      (preco ? '<div class="card"><h3>Preços que mudaram</h3><div class="list">' + preco + '</div></div>' : '') +

// --- leitura de códigos (QR da nota, código de barras): foto, câmera ao vivo ou digitação
async function detectarEmImagem(img, formatos) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, esc_ = Math.min(1, 1600 / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * esc_); cv.height = Math.round(h * esc_);
  const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, cv.width, cv.height);
  if ('BarcodeDetector' in window) { try { const r = await new BarcodeDetector({ formats: formatos }).detect(cv); if (r.length) return r[0].rawValue; } catch (e) { /* tenta jsQR */ } }
  if (formatos.includes('qr_code') && window.jsQR) { const id = ctx.getImageData(0, 0, cv.width, cv.height); const r = jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' }); if (r) return r.data; }
  return '';
}
function lerArquivo(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Não consegui abrir a imagem.')); i.src = u; }); }

function abrirScanner(titulo, formatos, onTexto, dica) {
  let stream = null, parado = false;
  const m = modal('<header><h2>' + esc(titulo) + '</h2><button class="btn sm" data-close>✕</button></header>' + (dica ? '<p class="muted">' + dica + '</p>' : '') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn primary" style="cursor:pointer">📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="s-file" hidden></label><button class="btn" id="s-live">Câmera ao vivo</button></div>' +
    '<video class="cam" id="s-video" playsinline muted hidden style="margin-top:10px"></video><div id="s-msg" class="muted" style="margin-top:8px"></div>' +
    '<label class="f" style="margin-top:12px">Ou cole / digite o link, a chave ou o código<input id="s-txt" placeholder="https://… ou 44 dígitos"></label><div class="actions"><button class="btn primary" id="s-ok">Usar</button></div>', { onClose: () => { parado = true; if (stream) stream.getTracks().forEach((t) => t.stop()); } });
  const msg = (t) => $('#s-msg', m.el).textContent = t;
  const entrega = (t) => { m.close(); onTexto(t); };
  $('#s-file', m.el).onchange = (e) => run(async () => { const f = e.target.files[0]; if (!f) return; msg('Lendo imagem…'); const t = await detectarEmImagem(await lerArquivo(f), formatos); if (t) entrega(t); else msg('Não achei o código na foto. Tente chegar mais perto, com boa luz, ou cole o link.'); });
  $('#s-ok', m.el).onclick = () => { const t = $('#s-txt', m.el).value.trim(); if (t) entrega(t); };
  $('#s-live', m.el).onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('#s-video', m.el); v.hidden = false; v.srcObject = stream; await v.play(); msg('Aponte para o código…');
      const det = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: formatos }) : null, cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
      const loop = async () => {
        if (parado) return;
        try {
          let t = '';
          if (det) { const r = await det.detect(v); if (r.length) t = r[0].rawValue; }
          if (!t && formatos.includes('qr_code') && window.jsQR && v.videoWidth) { cv.width = v.videoWidth; cv.height = v.videoHeight; ctx.drawImage(v, 0, 0); const id = ctx.getImageData(0, 0, cv.width, cv.height); const r = jsQR(id.data, id.width, id.height); if (r) t = r.data; }
          if (t) { entrega(t); return; }
        } catch (e) { /* continua */ }
        setTimeout(loop, 250);
      };
      loop();
    } catch (e) { msg('A câmera ao vivo não está disponível aqui (comum dentro do Apps Script). Use "Tirar foto".'); }
  };
}

function graficoSvg(mensal) {
  if (!mensal || mensal.length < 2) return '<div class="empty">Precisa de 2 meses de preços para o gráfico.</div>';
  const W = 320, H = 130, P = 22, vs = mensal.map((m) => m.medio), mn = Math.min(...vs), mx = Math.max(...vs), r = (mx - mn) || 1;
  const x = (i) => P + i * (W - 2 * P) / (mensal.length - 1), y = (v) => H - P - (v - mn) / r * (H - 2 * P);
  const d = mensal.map((m, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(m.medio).toFixed(1)).join(' ');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Preço mensal"><path d="' + d + '"/>' + mensal.map((m, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(m.medio).toFixed(1) + '" r="3"/><text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + m.mes.substr(5) + '/' + m.mes.substr(2, 2) + '</text><text x="' + x(i).toFixed(1) + '" y="' + (y(m.medio) - 7).toFixed(1) + '" text-anchor="middle">' + m.medio.toFixed(2).replace('.', ',') + '</text>').join('') + '</svg>';
}

function crudModal(entity, obj, done, aviso) {
  const cfg = ENT[entity]; obj = obj || {};

    const [k, rot, tipo, op] = c, v = obj[k] === undefined ? '' : obj[k];
    let inp;
    if (tipo === 'select') inp = '<select data-k="' + k + '">' + optsHtml(op, v || op[0]) + '</select>';
    else if (tipo === 'cat') inp = '<select data-k="' + k + '">' + optsHtml(S.boot.categorias, v, 'id', 'nome', '—') + '</select>';
    else if (tipo === 'conta') inp = '<select data-k="' + k + '">' + optsHtml(S.boot.contas, v, 'id', 'nome', '—') + '</select>';
    else if (tipo === 'unidade') inp = '<select data-k="' + k + '">' + optsHtml(S.boot.unidades || [], v || 'un', 'codigo', 'nome') + '</select>';
    else if (tipo === 'date') inp = '<input type="date" data-k="' + k + '" value="' + esc(v) + '">';
    else if (tipo === 'number') inp = '<input data-k="' + k + '" inputmode="decimal" value="' + esc(String(v).replace('.', ',')) + '">';
    else inp = '<input data-k="' + k + '" value="' + esc(v) + '">';
    return '<label class="f">' + esc(rot) + inp + '</label>';
  };
  const m = modal('<header><h2>' + (obj.id ? 'Editar' : 'Novo') + ' · ' + cfg.titulo + '</h2><button class="btn sm" data-close>✕</button></header>' + (aviso ? '<div class="alert">' + esc(aviso) + '</div>' : '') + '<div class="form2">' + cfg.campos.map(campo).join('') + '</div><div class="actions">' + (obj.id ? '<button class="btn danger" id="c-del">Excluir</button>' : '') + '<button class="btn primary" id="c-ok">Salvar</button></div>');
  $('#c-ok', m.el).onclick = () => run(async () => {
    const o = Object.assign({}, obj);
    cfg.campos.forEach((c) => { const el = $('[data-k=' + c[0] + ']', m.el); o[c[0]] = c[2] === 'number' ? (el.value === '' ? '' : num(el.value)) : el.value; });
    await api('crud.save', { entity, obj: o, _rid: m.rid }); m.close(); toast('Salvo'); await refreshBoot(); if (done) done();
  });
  if (obj.id) $('#c-del', m.el).onclick = () => { if (confirm('Excluir? (Lançamentos antigos continuam)')) run(async () => { await api('crud.delete', { entity, id: obj.id, versao: obj.versao }); m.close(); await refreshBoot(); if (done) done(); }); };
}

// ======================================================================= LOGIN, ESPAÇOS (cada pessoa com os seus dados) E CONVITES
function mostrarLogin(msgInicial) {
  $('#fab').style.display = 'none'; $('#nav').innerHTML = '<div class="brand">💚 Finanças</div>';
  $('#main').innerHTML = '<div class="topbar"><h1>Entrar</h1></div><div class="card" style="max-width:420px"><p class="muted">Digite seu e-mail. Enviamos um código de 6 dígitos para você confirmar que é você. Cada pessoa vê <b>só as próprias</b> finanças.</p>' +
    '<div id="l-passo1"><label class="f">E-mail<input id="l-email" type="email" autocomplete="email" placeholder="voce@gmail.com" value="' + esc(lembrar('fin_email')) + '"></label><button class="btn primary" id="l-pedir">Enviar código</button></div>' +
    '<div id="l-passo2" hidden><label class="f">Código recebido por e-mail<input id="l-cod" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label><button class="btn primary" id="l-ok">Entrar</button> <button class="btn" id="l-voltar">Trocar e-mail</button></div>' +
    (msgInicial ? '<div class="alert" style="margin-top:10px">' + esc(msgInicial) + '</div>' : '') + '</div>';
  let email = '';
  $('#l-pedir').onclick = () => run(async () => {
    email = $('#l-email').value.trim(); await api('auth.pedir', { email }); guardar('fin_email', email);
    $('#l-passo1').hidden = true; $('#l-passo2').hidden = false; toast('Se o e-mail puder entrar, o código chegou (veja também o spam).'); $('#l-cod').focus();
  });
  $('#l-voltar').onclick = () => { $('#l-passo2').hidden = true; $('#l-passo1').hidden = false; };
  $('#l-ok').onclick = () => run(async () => {
    const r = await api('auth.confirmar', { email, codigo: $('#l-cod').value }); S.tk = r.token; guardar('fin_tk', r.token); await iniciar();
  });
}

async function recarregarListaEspacos() {
  const l = await api('ws.listar'); S.espacos = l.espacos; S.email = l.email;
  const salvo = lembrar('fin_ws');
  S.ws = S.espacos.some((e) => e.id === S.ws) ? S.ws : (S.espacos.some((e) => e.id === salvo) ? salvo : (S.espacos.length === 1 ? S.espacos[0].id : ''));
  guardar('fin_ws', S.ws); return l;
}

async function carregarEspaco() {
  S.boot = await api('bootstrap'); S.mes = S.boot.hoje.substr(0, 7); S.view = 'inicio';
  $('#fab').style.display = podeEditar() ? '' : 'none'; renderNav(); await render();
}

function onboarding() {
  $('#fab').style.display = 'none'; $('#nav').innerHTML = '<div class="brand">💚 Finanças</div>';
  $('#main').innerHTML = '<div class="topbar"><h1>Bem-vindo(a)</h1></div><div class="card" style="max-width:520px"><h3>Criar meu espaço</h3>' +
    '<p class="muted">Suas finanças ficam num espaço <b>só seu</b>. Ninguém vê, a não ser quem você convidar. Se alguém já convidou o e-mail <b>' + esc(S.email) + '</b>, o espaço dessa pessoa aparece em <b>Meus espaços</b>.</p>' +
    '<label class="f">Nome do espaço<input id="o-nome" value="Minhas finanças"></label><button class="btn primary" id="o-criar">Criar meu espaço</button></div>';
  $('#o-criar').onclick = () => run(async () => { const r = await api('ws.criar', { nome: $('#o-nome').value }); S.ws = r.id; guardar('fin_ws', r.id); await recarregarListaEspacos(); toast('Espaço criado'); await carregarEspaco(); });
}

function abrirEspacos() {
  const m = modal('<header><h2>Meus espaços</h2><button class="btn sm" data-close>✕</button></header><div id="e-lista"></div>' +
    '<h3 style="margin:14px 0 6px">Criar novo espaço</h3><div style="display:flex;gap:8px"><input id="e-nome" placeholder="Ex.: Casa de praia"><button class="btn primary" id="e-criar">Criar</button></div>' +
    '<p class="muted" style="margin-top:10px;font-size:12px">Para entrar no espaço de outra pessoa, ela precisa convidar o seu e-mail (' + esc(S.email) + '). Depois é só abrir o app: o espaço aparece aqui.</p>');
  const desenha = () => {
    $('#e-lista', m.el).innerHTML = '<div class="list">' + (S.espacos.map((e) => '<div class="item" style="cursor:default"><div class="t"><b>' + esc(e.nome) + (e.id === S.ws ? ' <span class="chip ok">atual</span>' : '') + '</b><div class="s">' + esc(e.papel) + '</div></div><div style="display:flex;gap:6px">' +
      (e.id === S.ws ? '' : '<button class="btn sm primary" data-abrir="' + esc(e.id) + '">Abrir</button>') + '<button class="btn sm danger" data-sair="' + esc(e.id) + '" title="Sair deste espaço (não apaga os dados)">Sair</button></div></div>').join('') || '<div class="empty">Nenhum espaço.</div>') + '</div>';
    bind('[data-abrir]', 'click', (el) => run(async () => { S.ws = el.dataset.abrir; guardar('fin_ws', S.ws); m.close(); await carregarEspaco(); }), m.el);
    bind('[data-sair]', 'click', (el) => { if (confirm('Sair deste espaço? Você deixa de ter acesso (os dados não são apagados).')) run(async () => { const l = await api('ws.sair', { id: el.dataset.sair }); S.espacos = l.espacos; const eraAtual = el.dataset.sair === S.ws; if (eraAtual) { S.ws = ''; guardar('fin_ws', ''); } m.close(); if (!S.espacos.length) onboarding(); else if (eraAtual) { S.ws = S.espacos[0].id; guardar('fin_ws', S.ws); await carregarEspaco(); } else abrirEspacos(); }); }, m.el);
  };
  desenha();
  $('#e-criar', m.el).onclick = () => run(async () => { const r = await api('ws.criar', { nome: $('#e-nome', m.el).value }); S.ws = r.id; guardar('fin_ws', r.id); await recarregarListaEspacos(); m.close(); await carregarEspaco(); toast('Espaço criado'); });
}

function abrirConvite() {
  const m = modal('<header><h2>Compartilhar este espaço</h2><button class="btn sm" data-close>✕</button></header>' +
    '<p class="muted">Convide pelo <b>e-mail</b>. A pessoa entra com o próprio login e este espaço aparece na lista dela; o espaço pessoal dela continua separado. Você pode remover o acesso quando quiser.</p>' +
    '<div id="c-pessoas"></div><h3 style="margin:14px 0 6px">Convidar</h3><div class="form2"><label class="f">E-mail<input id="c-email" type="email" placeholder="pessoa@gmail.com"></label>' +
    '<label class="f">Nome (opcional)<input id="c-nome"></label><label class="f">Pode<select id="c-papel"><option value="editor">Lançar e editar</option><option value="leitura">Só ver</option><option value="admin">Tudo (inclusive convidar)</option></select></label></div>' +
    '<div class="actions"><button class="btn primary" id="c-ok">Convidar</button></div>', { wide: true });
  const pessoas = () => run(async () => {
    const r = await api('crud.list', { entity: 'Usuarios' });
    $('#c-pessoas', m.el).innerHTML = '<div class="list">' + r.map((x) => '<div class="item" style="cursor:default"><div class="t"><b>' + esc(x.nome || x.email) + '</b><div class="s">' + esc(x.email) + ' · ' + esc(x.papel) + (x.ativo === 'NAO' ? ' · inativo' : '') + '</div></div>' +
      (x.email === S.email ? '<span class="chip">você</span>' : '<button class="btn sm danger" data-rm="' + esc(x.email) + '">Remover</button>') + '</div>').join('') + '</div>';
    bind('[data-rm]', 'click', (el) => { if (confirm('Remover ' + el.dataset.rm + '? Ela perde o acesso a este espaço.')) run(async () => { await api('crud.delete', { entity: 'Usuarios', id: el.dataset.rm }); toast('Acesso removido'); pessoas(); }); }, m.el);
  });
  pessoas();
  $('#c-ok', m.el).onclick = () => run(async () => {
    const em = $('#c-email', m.el).value; await api('ws.convidar', { email: em, nome: $('#c-nome', m.el).value, papel: $('#c-papel', m.el).value, _rid: m.rid });
    toast('Convidado(a): ' + em + '. Peça para abrir o app e entrar com este e-mail.'); $('#c-email', m.el).value = ''; $('#c-nome', m.el).value = ''; pessoas();
  });
}

function abrirAdminPlataforma() {
  const m = modal('<header><h2>Administração da plataforma</h2><button class="btn sm" data-close>✕</button></header><div id="ad-corpo"><div class="empty">Carregando…</div></div>', { wide: true });
  const desenha = () => run(async () => {
    const d = await api('admin.painel');
    $('#ad-corpo', m.el).innerHTML = '<div class="card" style="margin-bottom:12px"><h3>Cadastro</h3><p class="muted">' + (d.cadastro_aberto ? 'Aberto: qualquer pessoa pode pedir código e criar a própria conta.' : 'Fechado: só quem foi convidado para algum espaço recebe código.') + '</p><button class="btn" id="ad-toggle">' + (d.cadastro_aberto ? 'Fechar cadastro' : 'Abrir cadastro') + '</button></div>' +
      '<h3 style="margin:8px 0 4px">Usuários (' + d.usuarios.length + ') · ' + d.total_espacos + ' espaço(s)</h3><div class="list">' + d.usuarios.map((u) => '<div class="item" style="cursor:default"><div class="t"><b>' + esc(u.nome || u.email) + '</b><div class="s">' + esc(u.email) + ' · ' + u.n_espacos + ' espaço(s) · ' + esc(u.papel_plataforma) + '</div></div>' +
      (u.email === S.email ? '<span class="chip">você</span>' : '<button class="btn sm" data-pp="' + esc(u.email) + '" data-novo="' + (u.papel_plataforma === 'admin' ? 'usuario' : 'admin') + '">' + (u.papel_plataforma === 'admin' ? 'Tirar admin' : 'Tornar admin') + '</button>') + '</div>').join('') + '</div>';
    $('#ad-toggle', m.el).onclick = () => run(async () => { await api('admin.cadastro', { aberto: !d.cadastro_aberto }); desenha(); });
    bind('[data-pp]', 'click', (el) => { if (confirm('Alterar o papel de plataforma de ' + el.dataset.pp + '?')) run(async () => { await api('admin.papel', { email: el.dataset.pp, papel: el.dataset.novo }); desenha(); }); }, m.el);
  });
  desenha();
}

// ---------- início ----------
async function iniciar() {
  const ws = lembrar('fin_ws');
  if (ws) {                                    // caminho rápido: pede tudo AO MESMO TEMPO (1 só ida e volta ao servidor)
    S.ws = ws;
    const [l, b, d] = await Promise.allSettled([api('ws.listar'), api('bootstrap'), api('dashboard')]);
    const login = [l, b, d].find((x) => x.status === 'rejected' && x.reason && x.reason.codigo === 'LOGIN');
    if (login) throw login.reason;
    if (l.status === 'fulfilled' && b.status === 'fulfilled' && d.status === 'fulfilled' && l.value.espacos.some((e) => e.id === ws)) {
      S.espacos = l.value.espacos; S.email = l.value.email; S.boot = b.value; S.mes = b.value.hoje.substr(0, 7); S.preDash = d.value; S.view = 'inicio';
      $('#fab').style.display = podeEditar() ? '' : 'none'; renderNav(); await render(); return;
    }
  }
  await recarregarListaEspacos();
  if (!S.espacos.length) return onboarding();
  if (!S.ws) { $('#nav').innerHTML = '<div class="brand">💚 Finanças</div>'; $('#main').innerHTML = '<div class="empty">Escolha um espaço.</div>'; return abrirEspacos(); }
  await carregarEspaco();
}
(async function init() {
  S.tk = lembrar('fin_tk'); renderNav();
  try { await iniciar(); }
  catch (e) {
    if (e.codigo === 'LOGIN') { S.tk = ''; guardar('fin_tk', ''); return mostrarLogin(); }
    $('#main').innerHTML = '<div class="alert bad"><b>Não consegui carregar.</b><br>' + esc(e.message) + '</div>';
  }
})();
</script>
