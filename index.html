  <script>
/* Tema: claro, escuro ou automático (segue o sistema). Roda no <head> para não piscar. Preferência em localStorage 'fin_tema'. */
(function () {
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function pref() { try { return localStorage.getItem('fin_tema') || 'auto'; } catch (e) { return 'auto'; } }
  function aplicar(p) {
    p = p || pref();
    var t = p === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : p;
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-tema-pref', p);
  }
  window.Tema = { pref: pref, aplicar: aplicar, definir: function (p) { try { localStorage.setItem('fin_tema', p); } catch (e) { /* sem armazenamento */ } aplicar(p); } };
  aplicar();
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (pref() === 'auto') aplicar(); });
  try { if (localStorage.getItem('fin_nav') === 'rail') document.documentElement.setAttribute('data-nav-pref', 'rail'); } catch (e) { /* idem */ }
})();
</script>

/* =============================================================================
   Finanças — design system único.
   1) Tokens (:root e [data-theme="dark"]): toda cor, medida, raio, sombra, tempo e camada.
   2) Base.  3) Layout.  4) Componentes (um nome por função).
   Regra: nenhum valor solto fora dos tokens. style="" só para valor dinâmico.
   ========================================================================== */
:root,[data-theme="light"]{
  color-scheme: light;
  /* superfícies e texto */
  --c-bg: oklch(0.982 0.004 255);
  --c-surface: oklch(1 0 0);
  --c-surface-2: oklch(0.963 0.005 255);
  --c-surface-3: oklch(0.93 0.007 255);
  --c-overlay: oklch(0.2 0.02 260 / 0.5);
  --c-text: oklch(0.23 0.018 262);
  --c-text-2: oklch(0.46 0.018 262);
  --c-border: oklch(0.905 0.006 255);
  --c-border-strong: oklch(0.6 0.014 258);
  /* marca */
  --c-primary: oklch(0.5 0.17 266);
  --c-primary-hover: oklch(0.44 0.17 266);
  --c-primary-soft: oklch(0.95 0.028 266);
  --c-primary-ink: oklch(0.44 0.17 266);
  --c-on-primary: oklch(0.99 0.003 266);
  /* semânticas */
  --c-success: oklch(0.55 0.13 155);
  --c-success-soft: oklch(0.955 0.04 155);
  --c-success-ink: oklch(0.43 0.11 155);
  --c-warning: oklch(0.64 0.15 62);
  --c-warning-soft: oklch(0.962 0.045 80);
  --c-warning-ink: oklch(0.47 0.11 58);
  --c-danger: oklch(0.55 0.2 27);
  --c-danger-hover: oklch(0.49 0.2 27);
  --c-danger-soft: oklch(0.958 0.028 27);
  --c-danger-ink: oklch(0.48 0.18 27);
  --c-on-danger: oklch(0.99 0.003 27);
  --c-info-soft: var(--c-primary-soft);
  --c-info-ink: var(--c-primary-ink);
  --c-inverse: oklch(0.25 0.018 262);
  --c-on-inverse: oklch(0.97 0.004 262);
  /* séries de gráfico e cores de categoria */
  --c-s1: oklch(0.52 0.17 266);
  --c-s2: oklch(0.6 0.11 195);
  --c-s3: oklch(0.66 0.14 68);
  --c-s4: oklch(0.56 0.17 335);
  --c-s5: oklch(0.56 0.13 150);
  --c-s6: oklch(0.58 0.15 25);
  --c-s7: oklch(0.55 0.13 300);
  --c-s8: oklch(0.6 0.02 260);
  --c-grid: var(--c-border);
  /* esqueleto */
  --c-skel: var(--c-surface-3);
  --c-skel-shine: oklch(1 0 0 / 0.65);

  /* tipografia (rem: respeita o tamanho do navegador) */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 0.8125rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.25rem;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --lh-tight: 1.2;
  --lh-snug: 1.35;
  --lh-body: 1.5;
  --ls-tight: -0.02em;
  --ls-caps: 0.06em;

  /* espaçamento (escala de 4 px) */
  --sp-0: 0;
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-8: 2rem;
  --sp-10: 2.5rem;
  --sp-12: 3rem;
  --sp-16: 4rem;

  /* raio */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-full: 999px;

  /* borda, sombra e elevação */
  --bw: 1px;
  --bw-focus: 2px;
  --shadow-1: 0 1px 2px oklch(0.2 0.02 260 / 0.06);
  --shadow-2: 0 2px 6px oklch(0.2 0.02 260 / 0.06), 0 8px 24px oklch(0.2 0.02 260 / 0.08);
  --shadow-3: 0 12px 40px oklch(0.2 0.02 260 / 0.18);
  --elev-card: var(--shadow-1);
  --elev-popover: var(--shadow-2);
  --elev-modal: var(--shadow-3);

  /* movimento */
  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 320ms;
  --dur-shimmer: 1400ms;
  --dur-spin: 700ms;
  --dur-chart: 600ms;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* camadas */
  --z-base: 1;
  --z-sticky: 20;
  --z-nav: 30;
  --z-fab: 35;
  --z-overlay: 60;
  --z-popover: 70;
  --z-toast: 90;
  --z-tooltip: 95;

  /* ícones, alvos de toque e layout */
  --icon-sm: 1rem;
  --icon-md: 1.25rem;
  --icon-lg: 1.5rem;
  --icon-xl: 2.5rem;
  --tap: 2.75rem;
  --tap-sm: 2.25rem;
  --control-h: 3rem;
  --avatar: 2.5rem;
  --avatar-sm: 2rem;
  --nav-h: 4rem;
  --topbar-h: 3.75rem;
  --side-w: 15.5rem;
  --side-w-rail: 4.75rem;
  --content-max: 72rem;
  --sheet-w: 35rem;
  --sheet-w-wide: 52rem;
  --popover-w: 20rem;
  --chart-h: 13rem;
  --bar-h: 0.5rem;
  --line-w: 2px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

  --c-warning: oklch(0.8 0.14 75);

  --c-danger: oklch(0.71 0.16 25);
  --c-danger-hover: oklch(0.77 0.14 25);
  --c-danger-soft: oklch(0.3 0.07 25);
  --c-danger-ink: oklch(0.82 0.11 25);
  --c-on-danger: oklch(0.17 0.03 25);
  --c-inverse: oklch(0.93 0.008 262);
  --c-on-inverse: oklch(0.2 0.016 262);
  --c-s1: oklch(0.74 0.13 266);
  --c-s2: oklch(0.76 0.11 195);
  --c-s3: oklch(0.8 0.13 75);
  --c-s4: oklch(0.74 0.15 340);
  --c-s5: oklch(0.76 0.14 150);
  --c-s6: oklch(0.72 0.15 25);
  --c-s7: oklch(0.74 0.12 300);
  --c-s8: oklch(0.7 0.02 260);
  --c-skel-shine: oklch(1 0 0 / 0.07);
  --shadow-1: 0 0 0 transparent;
  --shadow-2: 0 4px 16px oklch(0 0 0 / 0.4);
  --shadow-3: 0 16px 48px oklch(0 0 0 / 0.55);
}

@media (prefers-reduced-motion: reduce){

/* ============================================================== BASE */
*,*::before,*::after{ box-sizing: border-box; }
html{ font-size: 100%; -webkit-text-size-adjust: 100%; }
html,body{ margin: 0; background: var(--c-bg); color: var(--c-text); }
[data-theme]{ color: var(--c-text); }
body{ font-family: var(--font-sans); font-size: var(--fs-md); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button,input,textarea{ font: inherit; color: inherit; }
button{ cursor: pointer; }
a{ color: var(--c-primary-ink); text-underline-offset: 0.2em; }

h1,h2,h3,h4,p{ margin: 0; }
h1{ font-size: var(--fs-2xl); line-height: var(--lh-tight); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); }
h2{ font-size: var(--fs-xl); line-height: var(--lh-tight); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); }

.t-muted{ color: var(--c-text-2); }
.t-sm{ font-size: var(--fs-sm); }

.ellipsis{ display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp-2{ display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.stack{ display: flex; flex-direction: column; gap: var(--sp-4); }

[data-role="leitura"] .needs-edit{ display: none !important; }
[data-plataforma="nao"] .needs-plataforma{ display: none !important; }
[data-papel-espaco="nao-admin"] .needs-admin{ display: none !important; }

/* ============================================================== ÍCONE */
.ico{ width: var(--icon-md); height: var(--icon-md); flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.ico--sm{ width: var(--icon-sm); height: var(--icon-sm); }
.ico--lg{ width: var(--icon-lg); height: var(--icon-lg); }
.ico--xl{ width: var(--icon-xl); height: var(--icon-xl); stroke-width: 1.5; }

/* ============================================================== LAYOUT */
.app{ min-height: 100dvh; }
.main{ min-width: 0; }
.page{ width: 100%; max-width: var(--content-max); margin: 0 auto; padding: var(--sp-4) var(--sp-4) calc(var(--nav-h) + var(--sp-16) + var(--safe-b)); display: flex; flex-direction: column; gap: var(--sp-6); }
.page-head{ display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; min-height: var(--tap); }
.page-head__actions{ display: flex; align-items: center; gap: var(--sp-2); }
.section{ display: flex; flex-direction: column; gap: var(--sp-3); }
.section__head{ display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: var(--tap-sm); }
.layout-dash{ display: grid; gap: var(--sp-4); grid-template-columns: minmax(0,1fr); }
.layout-dash__main,.layout-dash__side{ display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
.grid-auto{ display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); }
.form-grid{ display: grid; gap: var(--sp-4); grid-template-columns: minmax(0,1fr); }
.form-grid--3{ grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--sp-3); }
.page-head .select{ min-width: 11rem; }
.nav__list > li.nav__desk{ display: none; }
@media (max-width: 767px){ .so-desktop{ display: none !important; } }
@media (min-width: 768px){ .so-celular{ display: none !important; } .nav__list > li.nav__desk{ display: flex; } }

@media (min-width: 768px){
  .app{ display: grid; grid-template-columns: var(--side-w-rail) minmax(0,1fr); }
  .app[data-nav="aberta"]{ grid-template-columns: var(--side-w) minmax(0,1fr); }
  .page{ padding: var(--sp-6) var(--sp-8) var(--sp-16); }
  .form-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  .form-grid > .field--full{ grid-column: 1 / -1; }
}
@media (min-width: 1024px){
  .layout-dash{ grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); align-items: start; }
}

/* ============================================================== BARRA SUPERIOR */
.topbar{ position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--sp-2); min-height: var(--topbar-h); padding: var(--sp-2) var(--sp-4); background: color-mix(in oklch, var(--c-bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: var(--bw) solid transparent; }
.topbar.is-scrolled{ border-bottom-color: var(--c-border); }
.topbar__space{ display: flex; align-items: center; gap: var(--sp-2); min-height: var(--tap); padding: var(--sp-1) var(--sp-2) var(--sp-1) var(--sp-1); border: 0; border-radius: var(--r-full); background: transparent; font-weight: var(--fw-semibold); min-width: 0; max-width: 70%; }
.topbar__space:hover{ background: var(--c-surface-2); }
.topbar__end{ margin-left: auto; display: flex; align-items: center; gap: var(--sp-1); }
@media (min-width: 768px){ .topbar{ padding: var(--sp-2) var(--sp-8); } }

/* ============================================================== NAVEGAÇÃO */
.nav{ position: fixed; z-index: var(--z-nav); left: 0; right: 0; bottom: 0; display: flex; padding: 0 var(--sp-1) var(--safe-b); height: calc(var(--nav-h) + var(--safe-b)); background: var(--c-surface); border-top: var(--bw) solid var(--c-border); }
.nav__brand,.nav__new,.nav__foot,.nav__toggle,.nav__extra{ display: none; }
.nav__list{ display: flex; flex: 1; margin: 0; padding: 0; list-style: none; }
.nav__list > li{ flex: 1; display: flex; }
.nav__item{ flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1); min-height: var(--tap); padding: var(--sp-1); border: 0; border-radius: var(--r-md); background: transparent; color: var(--c-text-2); font-size: var(--fs-xs); font-weight: var(--fw-medium); text-decoration: none; position: relative; }
.nav__item[aria-current="page"]{ color: var(--c-primary-ink); }
.nav__item[aria-current="page"] .ico{ stroke-width: 2.25; }
.nav__item:hover{ color: var(--c-text); }
.nav__label{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nav__dot{ position: absolute; top: var(--sp-1); left: calc(50% + var(--sp-2)); min-width: var(--sp-2); height: var(--sp-2); border-radius: var(--r-full); background: var(--c-danger); }
@media (min-width: 768px){
  .nav{ position: sticky; top: 0; height: 100dvh; flex-direction: column; gap: var(--sp-1); padding: var(--sp-4) var(--sp-3); border-top: 0; border-right: var(--bw) solid var(--c-border); overflow: hidden auto; }
  .nav__brand{ display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); padding: 0 var(--sp-2); font-weight: var(--fw-bold); font-size: var(--fs-lg); letter-spacing: var(--ls-tight); }
  .nav__mark{ width: var(--tap-sm); height: var(--tap-sm); flex: none; display: grid; place-items: center; border-radius: var(--r-md); background: var(--c-primary); color: var(--c-on-primary); }
  .nav__new{ display: flex; margin: var(--sp-3) 0 var(--sp-2); }
  .nav__list{ flex: 0 0 auto; flex-direction: column; gap: var(--sp-1); }
  .nav__extra{ display: flex; flex-direction: column; gap: var(--sp-1); margin: 0; padding: var(--sp-3) 0 0; list-style: none; border-top: var(--bw) solid var(--c-border); margin-top: var(--sp-2); }
  .nav__item{ flex-direction: row; justify-content: flex-start; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-md); min-height: var(--tap); }
  .nav__item[aria-current="page"]{ background: var(--c-primary-soft); }
  .nav__dot{ position: static; margin-left: auto; }
  .nav__foot{ display: flex; flex-direction: column; gap: var(--sp-1); margin-top: auto; padding-top: var(--sp-3); }
  .nav__toggle{ display: flex; }
  .app:not([data-nav="aberta"]) .nav__label,.app:not([data-nav="aberta"]) .nav__brand-text,.app:not([data-nav="aberta"]) .nav__new .btn__label{ display: none; }
  .app:not([data-nav="aberta"]) .nav__item{ justify-content: center; padding: var(--sp-2); }
  .app:not([data-nav="aberta"]) .nav__brand{ justify-content: center; padding: 0; }
  .app:not([data-nav="aberta"]) .nav__dot{ position: absolute; top: var(--sp-2); right: var(--sp-2); margin: 0; }
  .app:not([data-nav="aberta"]) .nav__new .btn{ padding: 0; width: var(--tap); }
}

/* ============================================================== BOTÃO */
.btn{ --btn-bg: var(--c-surface); --btn-fg: var(--c-text); --btn-bd: var(--c-border-strong); --btn-bg-h: var(--c-surface-2);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: var(--tap); padding: 0 var(--sp-4); border: var(--bw) solid var(--btn-bd); border-radius: var(--r-md); background: var(--btn-bg); color: var(--btn-fg); font-size: var(--fs-md); font-weight: var(--fw-semibold); line-height: 1; white-space: nowrap; text-decoration: none; transition: background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out); -webkit-tap-highlight-color: transparent; }
.btn:hover{ background: var(--btn-bg-h); color: var(--btn-fg); }
.btn:active{ transform: scale(0.98); }
.btn--primary{ --btn-bg: var(--c-primary); --btn-fg: var(--c-on-primary); --btn-bd: transparent; --btn-bg-h: var(--c-primary-hover); }
.btn--secondary{ }
.btn--ghost{ --btn-bg: transparent; --btn-bd: transparent; --btn-bg-h: var(--c-surface-2); }
.btn--danger{ --btn-bg: var(--c-danger); --btn-fg: var(--c-on-danger); --btn-bd: transparent; --btn-bg-h: var(--c-danger-hover); }
.btn--danger-ghost{ --btn-bg: transparent; --btn-fg: var(--c-danger-ink); --btn-bd: transparent; --btn-bg-h: var(--c-danger-soft); }
.btn--icon{ width: var(--tap); padding: 0; flex: none; }
.btn--sm{ min-height: var(--tap-sm); padding: 0 var(--sp-3); font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn--sm.btn--icon{ width: var(--tap-sm); padding: 0; }
.btn--block{ width: 100%; }
.btn--pill{ border-radius: var(--r-full); }
.btn[disabled],.btn[aria-disabled="true"]{ opacity: 0.5; pointer-events: none; }
.btn.is-loading{ pointer-events: none; }
.btn.is-loading > :not(.spinner){ visibility: hidden; }

.fab{ position: fixed; z-index: var(--z-fab); right: var(--sp-4); bottom: calc(var(--nav-h) + var(--sp-4) + var(--safe-b)); width: calc(var(--tap) + var(--sp-3)); height: calc(var(--tap) + var(--sp-3)); display: grid; place-items: center; border: 0; border-radius: var(--r-lg); background: var(--c-primary); color: var(--c-on-primary); box-shadow: var(--shadow-2); transition: transform var(--dur-1) var(--ease-out), background var(--dur-1); }

/* ============================================================== SPINNER */
.spinner{ display: inline-block; width: var(--icon-md); height: var(--icon-md); flex: none; border-radius: var(--r-full); border: var(--bw-focus) solid currentColor; border-right-color: transparent; animation: spin var(--dur-spin) linear infinite; opacity: 0.85; }

/* ============================================================== CAMPOS */
.field{ display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }

.input{ width: 100%; min-height: var(--control-h); padding: var(--sp-3) var(--sp-3); border: var(--bw) solid var(--c-border-strong); border-radius: var(--r-md); background: var(--c-surface); color: var(--c-text); font-size: var(--fs-md); transition: border-color var(--dur-1), box-shadow var(--dur-1); appearance: none; }

.input--area{ min-height: calc(var(--control-h) * 2); resize: vertical; line-height: var(--lh-body); }

.input-wrap{ position: relative; display: flex; align-items: center; }

/* campo de moeda */
.money{ display: flex; align-items: baseline; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: var(--bw) solid var(--c-border-strong); border-radius: var(--r-md); background: var(--c-surface); transition: border-color var(--dur-1), box-shadow var(--dur-1); }
.money:focus-within{ border-color: var(--c-primary); box-shadow: 0 0 0 var(--bw-focus) var(--c-primary-soft), 0 0 0 calc(var(--bw-focus) * 2) var(--c-primary); }
.money__cur{ color: var(--c-text-2); font-weight: var(--fw-medium); }

/* passo (quantidade) */

/* código segmentado */
.otp{ display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-2); }
.otp__cell{ width: 100%; aspect-ratio: 0.85; min-height: var(--control-h); border: var(--bw) solid var(--c-border-strong); border-radius: var(--r-md); background: var(--c-surface); text-align: center; font-size: var(--fs-xl); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; caret-color: var(--c-primary); padding: 0; }

/* ============================================================== SELETOR RICO */
.select{ position: relative; min-width: 0; }
.select__trigger{ width: 100%; min-height: var(--control-h); display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: var(--bw) solid var(--c-border-strong); border-radius: var(--r-md); background: var(--c-surface); color: var(--c-text); text-align: left; font-size: var(--fs-md); }

.listbox{ display: flex; flex-direction: column; min-width: 0; }
.listbox__search{ padding: var(--sp-2); border-bottom: var(--bw) solid var(--c-border); position: sticky; top: 0; background: var(--c-surface); z-index: var(--z-base); }

.option{ display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); cursor: pointer; }

.option__meta{ font-size: var(--fs-sm); color: var(--c-text-2); font-weight: var(--fw-regular); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.option__trail{ font-size: var(--fs-sm); color: var(--c-text-2); font-variant-numeric: tabular-nums; font-weight: var(--fw-regular); }
.option__icon{ display: inline-flex; flex: none; color: var(--cat, var(--c-text-2)); }
.option__check{ color: var(--c-primary-ink); visibility: hidden; }
.option[aria-selected="true"] .option__check{ visibility: visible; }
.option--action{ color: var(--c-primary-ink); font-weight: var(--fw-semibold); }

/* ============================================================== INTERRUPTOR, CAIXA, RÁDIO */
.switch{ display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); min-height: var(--tap); cursor: pointer; }
.switch__label{ display: flex; flex-direction: column; min-width: 0; }
.switch__input{ appearance: none; flex: none; position: relative; width: 2.75rem; height: 1.625rem; margin: 0; border-radius: var(--r-full); background: var(--c-border-strong); transition: background var(--dur-2) var(--ease-out); cursor: pointer; }
.switch__input::after{ content: ""; position: absolute; top: 3px; left: 3px; width: calc(1.625rem - 6px); height: calc(1.625rem - 6px); border-radius: var(--r-full); background: var(--c-surface); box-shadow: var(--shadow-1); transition: transform var(--dur-2) var(--ease-out); }
.switch__input:checked{ background: var(--c-primary); }
.switch__input:checked::after{ transform: translateX(1.125rem); }
.check,.radio{ display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); cursor: pointer; }
.check__input,.radio__input{ appearance: none; flex: none; width: 1.375rem; height: 1.375rem; margin: 0; display: grid; place-items: center; border: var(--bw-focus) solid var(--c-border-strong); background: var(--c-surface); transition: background var(--dur-1), border-color var(--dur-1); cursor: pointer; }
.check__input{ border-radius: var(--r-xs); }

.check__input::after{ content: ""; width: 0.375rem; height: 0.7rem; border: solid var(--c-on-primary); border-width: 0 var(--bw-focus) var(--bw-focus) 0; transform: rotate(45deg) translate(-1px, -1px) scale(0); transition: transform var(--dur-1) var(--ease-out); }
.check__input:checked{ background: var(--c-primary); border-color: var(--c-primary); }
.check__input:checked::after{ transform: rotate(45deg) translate(-1px, -1px) scale(1); }
.radio__input::after{ content: ""; width: 0.625rem; height: 0.625rem; border-radius: var(--r-full); background: var(--c-primary); transform: scale(0); transition: transform var(--dur-1) var(--ease-out); }

.choice-card{ display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: var(--bw) solid var(--c-border); border-radius: var(--r-md); cursor: pointer; }

/* ============================================================== CHIP E BADGE */
.chip{ display: inline-flex; align-items: center; gap: var(--sp-1); min-height: var(--tap-sm); padding: 0 var(--sp-3); border: var(--bw) solid var(--c-border-strong); border-radius: var(--r-full); background: var(--c-surface); color: var(--c-text); font-size: var(--fs-sm); font-weight: var(--fw-medium); white-space: nowrap; max-width: 100%; }
.chip:hover{ background: var(--c-surface-2); }
.chip[aria-pressed="true"],.chip.is-on{ background: var(--c-primary-soft); border-color: var(--c-primary); color: var(--c-primary-ink); }
.chip__x{ display: grid; place-items: center; width: var(--icon-lg); height: var(--icon-lg); margin-right: calc(var(--sp-2) * -1); border: 0; border-radius: var(--r-full); background: transparent; color: inherit; padding: 0; }
.chip__x:hover{ background: var(--c-surface-3); }
.chip__text{ overflow: hidden; text-overflow: ellipsis; }
.chip--static{ cursor: default; }
.chips{ display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; padding-bottom: var(--sp-1); margin: 0 calc(var(--sp-4) * -1); padding-inline: var(--sp-4); }
.chips::-webkit-scrollbar{ display: none; }
.chips > .chip{ flex: none; }
@media (min-width: 768px){ .chips{ flex-wrap: wrap; margin: 0; padding-inline: 0; overflow: visible; } }
.badge{ display: inline-flex; align-items: center; gap: var(--sp-1); padding: 0 var(--sp-2); min-height: 1.5rem; border-radius: var(--r-full); background: var(--c-surface-2); color: var(--c-text-2); font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.badge .ico{ width: var(--icon-sm); height: var(--icon-sm); }
.badge--primary{ background: var(--c-primary-soft); color: var(--c-primary-ink); }
.badge--success{ background: var(--c-success-soft); color: var(--c-success-ink); }
.badge--warning{ background: var(--c-warning-soft); color: var(--c-warning-ink); }
.badge--danger{ background: var(--c-danger-soft); color: var(--c-danger-ink); }

/* ============================================================== TOOLTIP E POPOVER */
.tooltip{ position: fixed; z-index: var(--z-tooltip); max-width: min(20rem, calc(100vw - var(--sp-8))); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--c-inverse); color: var(--c-on-inverse); font-size: var(--fs-sm); line-height: var(--lh-snug); pointer-events: none; opacity: 0; transform: translateY(2px); transition: opacity var(--dur-1), transform var(--dur-1) var(--ease-out); }
.tooltip.is-on{ opacity: 1; transform: none; }
.popover{ position: fixed; z-index: var(--z-popover); min-width: 12rem; max-width: min(var(--popover-w), calc(100vw - var(--sp-4))); border: var(--bw) solid var(--c-border); border-radius: var(--r-md); background: var(--c-surface); box-shadow: var(--elev-popover); overflow: hidden; animation: pop-in var(--dur-2) var(--ease-out); }
.popover--wide{ --popover-w: 26rem; }
@keyframes pop-in{ from{ opacity: 0; transform: translateY(-4px) scale(0.98); } }
.menu{ list-style: none; margin: 0; padding: var(--sp-1); }
.menu__item{ width: 100%; display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; font-size: var(--fs-md); color: var(--c-text); }
.menu__item:hover,.menu__item:focus-visible{ background: var(--c-surface-2); outline: none; }
.menu__item--danger{ color: var(--c-danger-ink); }

/* ============================================================== MODAL / BOTTOM SHEET */
.overlay{ position: fixed; inset: 0; z-index: var(--z-overlay); display: flex; align-items: flex-end; justify-content: center; background: var(--c-overlay); animation: fade-in var(--dur-2) var(--ease-out); }

@keyframes fade-in{ from{ opacity: 0; } }
@keyframes fade-out{ to{ opacity: 0; } }
.sheet{ position: relative; width: 100%; max-height: 92dvh; display: flex; flex-direction: column; background: var(--c-surface); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--elev-modal); animation: sheet-up var(--dur-3) var(--ease-out); outline: none; }

@keyframes sheet-up{ from{ transform: translateY(100%); } }
@keyframes sheet-down{ to{ transform: translateY(100%); } }
.sheet__grip{ width: 2.5rem; height: var(--sp-1); margin: var(--sp-2) auto 0; border-radius: var(--r-full); background: var(--c-border-strong); flex: none; }
.sheet__head{ display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-3) var(--sp-2) var(--sp-5); flex: none; }
.sheet__title{ flex: 1; min-width: 0; font-size: var(--fs-lg); }
.sheet__body{ padding: var(--sp-2) var(--sp-5) var(--sp-5); overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: var(--sp-4); flex: 1 1 auto; }
.sheet__body--flush{ padding: 0; gap: 0; }
.sheet__foot{ display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-3) var(--sp-5) calc(var(--sp-3) + var(--safe-b)); border-top: var(--bw) solid var(--c-border); flex: none; }

@media (min-width: 768px){
  .overlay{ align-items: center; padding: var(--sp-6); }
  .sheet{ width: min(var(--sheet-w), 100%); max-height: min(88dvh, 52rem); border-radius: var(--r-lg); animation-name: dialog-in; }
  .sheet--wide{ width: min(var(--sheet-w-wide), 100%); }
  .sheet--sm{ width: min(26rem, 100%); }
  .overlay.is-closing .sheet{ animation-name: fade-out; }
  .sheet__grip{ display: none; }
  .sheet__head{ padding: var(--sp-4) var(--sp-4) var(--sp-2) var(--sp-6); }
  .sheet__body{ padding: var(--sp-2) var(--sp-6) var(--sp-6); }
  .sheet__foot{ padding: var(--sp-4) var(--sp-6); justify-content: flex-end; }
  .sheet__foot > .btn--primary{ flex: 0 0 auto; min-width: 8rem; }
}
@keyframes dialog-in{ from{ opacity: 0; transform: translateY(8px) scale(0.98); } }

/* ============================================================== TOAST */
.toasts{ position: fixed; z-index: var(--z-toast); left: var(--sp-4); right: var(--sp-4); bottom: calc(var(--nav-h) + var(--sp-4) + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); pointer-events: none; }
.toast{ pointer-events: auto; display: flex; align-items: center; gap: var(--sp-3); width: min(30rem, 100%); min-height: var(--tap); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4); border-radius: var(--r-md); background: var(--c-inverse); color: var(--c-on-inverse); box-shadow: var(--shadow-2); animation: toast-in var(--dur-3) var(--ease-out); }
.toast.is-closing{ animation: fade-out var(--dur-2) forwards; }
.toast__text{ flex: 1; min-width: 0; padding: var(--sp-1) 0; }

.toast .btn{ --btn-bg: transparent; --btn-bd: transparent; --btn-fg: var(--c-on-inverse); --btn-bg-h: color-mix(in oklch, var(--c-on-inverse) 14%, transparent); }

@media (min-width: 768px){ .toasts{ left: auto; right: var(--sp-6); bottom: var(--sp-6); align-items: flex-end; } }

/* ============================================================== ALERTA EM LINHA */
.alert{ display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--c-info-soft); color: var(--c-text); }

.alert__body{ flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.alert__title{ font-weight: var(--fw-semibold); }
.alert__action{ align-self: center; }
.alert--warning{ background: var(--c-warning-soft); }
.alert--warning > .ico{ color: var(--c-warning-ink); }
.alert--danger{ background: var(--c-danger-soft); }
.alert--danger > .ico{ color: var(--c-danger-ink); }
.alert--success{ background: var(--c-success-soft); }
.alert--success > .ico{ color: var(--c-success-ink); }
.banner{ position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; justify-content: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); background: var(--c-inverse); color: var(--c-on-inverse); font-size: var(--fs-sm); }

/* ============================================================== CARTÃO */
.card{ display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); border: var(--bw) solid var(--c-border); border-radius: var(--r-lg); background: var(--c-surface); box-shadow: var(--elev-card); min-width: 0; }
.card--flush{ padding: var(--sp-2) 0; gap: 0; }
.card--flush > .card__head{ padding: var(--sp-2) var(--sp-4); }
.card--hero{ padding: var(--sp-5); gap: var(--sp-4); }
.card--interactive{ cursor: pointer; transition: border-color var(--dur-1); text-align: left; color: inherit; font: inherit; }
.card--interactive:hover{ border-color: var(--c-border-strong); }
.card__head{ display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: var(--tap-sm); }
.card__title{ font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.card__foot{ display: flex; justify-content: flex-end; }
.card__body{ padding: 0 var(--sp-4) var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-3); }
.card--flush > .card__foot{ padding: var(--sp-2) var(--sp-4) var(--sp-1); border-top: var(--bw) solid var(--c-border); justify-content: center; }
@media (min-width: 768px){ .card{ padding: var(--sp-5); } .card--flush{ padding: var(--sp-2) 0; } .card--flush > .card__head{ padding: var(--sp-3) var(--sp-5); } .card__body{ padding: 0 var(--sp-5) var(--sp-4); } .card--hero{ padding: var(--sp-6); } }

/* ============================================================== NÚMERO EM DESTAQUE */
.stat{ display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.stat__label{ display: flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-sm); color: var(--c-text-2); font-weight: var(--fw-medium); }
.stat__value{ font-size: var(--fs-xl); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); font-variant-numeric: tabular-nums; line-height: var(--lh-tight); }
.stat--hero .stat__value{ font-size: var(--fs-3xl); font-weight: var(--fw-bold); }
.stat__meta{ font-size: var(--fs-sm); color: var(--c-text-2); }
.stats{ display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: var(--sp-4); }

/* ============================================================== ITEM DE LISTA */
.list{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

// ============================================================================ BASE: utilidades, estado, API, erros, toasts

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (v) => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (n) => (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brlSinal = (n, tipo) => (tipo === 'Entrada' ? '+ ' : tipo === 'Saída' ? '− ' : '') + brl(Math.abs(n));
const brlCurto = (n) => { const a = Math.abs(n); if (a >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi'; if (a >= 1e3) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil'; return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); };
const num = (v) => { if (typeof v === 'number') return v; let s = String(v || '').replace(/[R$\s\u00a0]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const numBR = (v, casas) => (v === '' || v === null || v === undefined) ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: casas || 0, maximumFractionDigits: casas === undefined ? 3 : casas });
const pct = (n) => n === null || n === undefined ? '—' : (n > 0 ? '+' : '') + String(Math.round(n * 10) / 10).replace('.', ',') + '%';
const hojeISO = () => (S.boot && S.boot.hoje) || isoLocal(new Date());
const isoLocal = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const paraData = (iso) => new Date(Number(iso.substr(0, 4)), Number(iso.substr(5, 2)) - 1, Number(iso.substr(8, 2) || 1));
const addDias = (iso, n) => { const d = paraData(iso); d.setDate(d.getDate() + n); return isoLocal(d); };
const addMeses = (ym, n) => { const d = new Date(Number(ym.substr(0, 4)), Number(ym.substr(5, 2)) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const difDias = (a, b) => Math.round((paraData(b) - paraData(a)) / 864e5);
const dBR = (iso) => iso ? iso.substr(8, 2) + '/' + iso.substr(5, 2) + '/' + iso.substr(0, 4) : '';
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesNome = (ym) => MESES[Number(ym.substr(5, 2)) - 1] + ' de ' + ym.substr(0, 4);
const mesCurto = (ym) => MESES[Number(ym.substr(5, 2)) - 1].substr(0, 3) + '/' + ym.substr(2, 2);
const maiusc = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function dDia(iso) {
  const h = hojeISO(), d = difDias(iso, h);
  if (d === 0) return 'Hoje'; if (d === 1) return 'Ontem'; if (d === -1) return 'Amanhã';
  const dt = paraData(iso);
  return maiusc(dt.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) + (iso.substr(0, 4) !== h.substr(0, 4) ? ' de ' + iso.substr(0, 4) : ''));
}
const iniciais = (s) => String(s || '?').trim().split(/\s+|@/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('') || '?';

const S = { boot: null, view: 'inicio', mes: null, busca: '', dash: null, ws: '', espacos: [], email: '', tk: '', periodo: 'atual', cacheDash: {}, filtros: { tipo: [], conta: [], categoria: [] } };

// ---------- API: única ponte com o servidor (Code.gs → ROTAS)
function api(action, payload) {
  const corpo = Object.assign({ _ws: S.ws, _tk: S.tk }, payload || {});
  const resposta = (r) => { if (r && r.ok) return r.data; const er = new Error((r && r.error) || 'Erro desconhecido'); er.codigo = (r && r.codigo) || ''; throw er; };
  const semRede = () => { const e = new Error('Sem conexão. Verifique a internet e tente de novo.'); e.codigo = 'OFFLINE'; return e; };
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script) {
      if (navigator.onLine === false) return reject(semRede());
      google.script.run.withSuccessHandler((r) => { try { resolve(resposta(r)); } catch (e) { reject(e); } })
        .withFailureHandler((e) => reject(navigator.onLine === false ? semRede() : new Error(e && e.message ? e.message : String(e)))).api(action, corpo);
    } else if (window.API_URL) {
      if (navigator.onLine === false) return reject(semRede());
      fetch(window.API_URL, { method: 'POST', redirect: 'follow', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload: corpo }) })
        .then((r) => r.json()).then((r) => { try { resolve(resposta(r)); } catch (e) { reject(e); } })
        .catch((e) => reject(e && e.codigo !== undefined ? e : semRede()));
    } else demoApi(action, corpo).then((r) => { try { resolve(resposta(r)); } catch (e) { reject(e); } });
  });
}

// ---------- erros
const tipoErro = (e) => e.codigo || (/^SEM PERMISS/i.test(e.message) || /^ACESSO NEGADO/i.test(e.message) ? 'PERMISSAO' : '');
const textoErro = (e) => String(e.message || e).replace(/^(SEM PERMISSÃO|ACESSO NEGADO|CONFLITO|DESATIVADO)\s*:\s*/i, '');
function tratarErro(e, repetir) {
  console.error(e);
  const t = tipoErro(e);
  if (t === 'LOGIN') { S.tk = ''; guardar('fin_tk', ''); return mostrarLogin(); }
  if (t === 'DESATIVADO') { S.tk = ''; guardar('fin_tk', ''); mostrarLogin(); return toast(textoErro(e), { tipo: 'danger' }); }
  if (t === 'SEM_ESPACO') return abrirEspacos();
  if (t === 'CONFLITO') return avisarConflito();
  if (t === 'PERMISSAO') return toast('Seu acesso não permite esta ação.', { tipo: 'danger' });
  toast(t === 'OFFLINE' ? 'Sem conexão.' : textoErro(e), { tipo: 'danger', acao: repetir ? { rotulo: 'Tentar de novo', fn: repetir } : null });
}
async function run(fn, repetir) {
  try { return await fn(); }
  catch (e) { tratarErro(e, repetir === false ? null : (repetir || (() => run(fn)))); return undefined; }
}
// botão ocupado: spinner no lugar do rótulo (mantém a largura) e bloqueio de duplo toque
async function ocupado(btn, fn) {
  if (!btn || btn.classList.contains('is-loading')) return;
  btn.classList.add('is-loading'); btn.setAttribute('aria-busy', 'true');
  const sp = document.createElement('span'); sp.className = 'spinner'; sp.setAttribute('aria-hidden', 'true'); btn.appendChild(sp);
  try { return await run(fn, () => ocupado(btn, fn)); }
  finally { btn.classList.remove('is-loading'); btn.removeAttribute('aria-busy'); sp.remove(); }
}

function avisarConflito() {
  const m = modal({ titulo: 'Registro alterado', tamanho: 'sm',
    corpo: estadoHtml({ icone: 'refresh', titulo: 'Alguém alterou este registro', texto: 'Recarregue para ver a versão atual e refaça a alteração.', tipo: 'warning', compacto: true }),
    rodape: '<button class="btn btn--primary" data-recarregar>Recarregar</button>' });
  $('[data-recarregar]', m.el).onclick = () => { fecharTodosModais(); S.cacheDash = {}; refreshBoot().then(refresh); };
}

// ---------- toast
function toast(msg, o) {
  o = o || {};
  let reg = $('#toasts');
  if (!reg) { reg = document.createElement('div'); reg.id = 'toasts'; reg.className = 'toasts'; reg.setAttribute('role', 'status'); reg.setAttribute('aria-live', 'polite'); document.body.appendChild(reg); }
  const t = document.createElement('div');
  const tipo = o.tipo || 'success';
  t.className = 'toast toast--' + tipo;
  t.innerHTML = '<span class="toast__icon">' + ico(tipo === 'danger' ? 'alert' : tipo === 'info' ? 'info' : 'checkCircle') + '</span><span class="toast__text">' + esc(msg) + '</span>' +
    (o.acao ? '<button class="btn btn--sm toast__action" data-t-acao>' + esc(o.acao.rotulo) + '</button>' : '') +
    '<button class="btn btn--sm btn--icon" data-t-fechar aria-label="Fechar aviso">' + ico('x', 'ico--sm') + '</button>';
  reg.appendChild(t);
  if (reg.children.length > 3) reg.firstChild.remove();
  let fechado = false;
  const fechar = () => { if (fechado) return; fechado = true; t.classList.add('is-closing'); setTimeout(() => t.remove(), 220); if (o.aoExpirar && !t._acionado) o.aoExpirar(); };
  $('[data-t-fechar]', t).onclick = fechar;
  if (o.acao) $('[data-t-acao]', t).onclick = () => { t._acionado = true; fechar(); o.acao.fn(); };
  const dur = o.duracao || (o.acao ? 6000 : tipo === 'danger' ? 6000 : 3000);
  let timer = setTimeout(fechar, dur);
  t.onpointerenter = () => clearTimeout(timer); t.onpointerleave = () => { timer = setTimeout(fechar, 2000); };
  return { fechar };
}

// ---------- atualização otimista: aplica na tela, envia; se falhar, reverte. Com "Desfazer" opcional.
async function otimista(o) {
  o.aplicar();
  try { const r = await o.enviar(); if (o.ok) o.ok(r); return r; }
  catch (e) { o.reverter(); tratarErro(e, () => otimista(o)); return undefined; }
}

// ---------- ícone

// ---------- campo de moeda (R$, máscara de centavos, teclado numérico)

/** Desenha a fonte (imagem ou vídeo) numa miniatura JPEG QUADRADA (≈ 200 px, até ~28 mil caracteres em base64). `contain`: mostra a imagem inteira com fundo branco; senão, recorta o centro. */

/** Fotografar o produto com a CÂMERA do aparelho (ao vivo). Não há envio de arquivo: a foto sai direto da câmera. */
function abrirCameraFoto(aoFoto) {
  let stream = null, parado = false, foto = '';
  const botaoTirar = btn({ rotulo: 'Tirar foto', icone: 'camera', variante: 'primary', attrs: 'data-cf-tirar disabled' });
  const m = modal({ titulo: 'Fotografar produto', tamanho: 'sm',
    corpo: '<div class="camera" id="cf-cam" aria-live="polite"><div class="camera__idle"><span class="spinner spinner--lg" aria-hidden="true"></span><p class="t-sm">Abrindo a câmera…</p></div></div>',
    rodape: botaoTirar, aoFechar: () => { parado = true; if (stream) stream.getTracks().forEach((t) => t.stop()); } });

  const mostrarVideo = () => { cam.innerHTML = '<video class="camera__video" playsinline muted></video><div class="camera__frame" aria-hidden="true"></div><p class="camera__msg">Enquadre o produto</p>'; const v = $('video', cam); v.srcObject = stream; return v.play(); };

      if (parado) { stream.getTracks().forEach((t) => t.stop()); return; }
      await mostrarVideo(); m.rodape(botaoTirar); ligarTirar();
    } catch (e) {
      cam.innerHTML = '<div class="camera__idle">' + ico('camera', 'ico--xl') + '<p class="t-sm">Não consegui abrir a câmera. Permita o acesso à câmera no navegador e tente de novo.</p>' + btn({ rotulo: 'Tentar de novo', icone: 'refresh', variante: 'secondary', attrs: 'data-cf-de-novo' }) + '</div>';
      $('[data-cf-de-novo]', cam).onclick = () => { cam.innerHTML = '<div class="camera__idle"><span class="spinner spinner--lg" aria-hidden="true"></span></div>'; abrir(); };
    }
  };
  const tirar = () => {
    const v = $('video', cam); if (!v || !v.videoWidth) return toast('A câmera ainda está abrindo.', { tipo: 'danger' });

  };

}

      interruptor({ id: 'lf-st', rotulo: 'Realizado', on: l.status !== 'Previsto' }) +

  const sConta = seletor(el, '#lf-conta', { opcoes: opcoesContas(), valor: l.conta_id || '', rotulo: 'Conta', aoMudar: () => ajusta() });
  const sDest = seletor(el, '#lf-dest', { opcoes: opcoesContas(), valor: l.conta_destino_id || '', rotulo: 'Conta de destino', placeholder: 'Escolher conta' });
  const sFat = seletor(el, '#lf-fat', { opcoes: [], valor: l.fatura_vencimento || '', rotulo: 'Fatura', busca: false });
  const ajusta = () => {
    const tr = tipo === 'Transferência', cartao = contaPorId(sConta.valor) || {};

  }

function crudModal(entity, obj, done, aviso) {
  const cfg = ENT[entity]; obj = obj || {}; const novo = !obj.id;

    const [k, rot, tipo, op] = c, v = obj[k] === undefined || obj[k] === null ? '' : obj[k], id = 'cr-' + k;

      '<div class="img-field__acoes">' + btn({ rotulo: 'Fotografar', icone: 'camera', variante: 'secondary', tam: 'sm', editar: true, attrs: 'data-cr-foto-cam' }) + btn({ rotulo: 'Remover foto', icone: 'trash', variante: 'ghost', tam: 'sm', editar: true, attrs: 'data-cr-foto-rm' }) + '</div></div></div>';
    if (tipo === 'sim') return '<div class="field field--full">' + interruptor({ id, rotulo: rot, on: v !== 'NAO' }) + '</div>';
    if (tipo === 'moeda') return campo({ tipo: 'moeda', id, rotulo: rot, valor: v === '' ? '' : num(v) });
    if (tipo === 'numero' || tipo === 'dia') return campo({ id, rotulo: rot, valor: v === '' ? '' : String(v).replace('.', ','), inputmode: tipo === 'dia' ? 'numeric' : 'decimal', wrap: 'w-' + k });
    if (tipo === 'data') return campo({ tipo: 'data', id, rotulo: rot, valor: v, atalhos: false });
    if (tipo === 'area') return campo({ tipo: 'area', id, rotulo: rot, valor: v, cheio: true });
    if (tipo === 'opcoes' || tipo === 'cat' || tipo === 'conta' || tipo === 'unidade') return campo({ tipo: 'seletor', id, rotulo: rot, wrap: 'w-' + k });
    return campo({ id, rotulo: rot, valor: v, inputmode: op || '', attrs: k === 'email' ? 'type="email" autocomplete="email"' : '' });
  };
  const m = modal({ titulo: (novo ? 'Novo' : 'Editar') + ' · ' + cfg.titulo, corpo: (aviso ? alerta({ tipo: 'info', texto: aviso }) : '') + '<div class="form-grid">' + cfg.campos.map(ctl).join('') + '</div>',
    rodape: (novo ? '' : btn({ rotulo: 'Excluir', icone: 'trash', variante: 'danger-ghost', so: true, editar: true, attrs: 'data-cr-del' })) + '<button type="button" class="btn btn--primary needs-edit" data-cr-ok>Salvar</button>' });
  const el = m.el;
  let fotoNova = null, fotoRemover = false;
  const fotoEl = $('#cr-foto', el);
  if (fotoEl) {
    $('[data-cr-foto-cam]', el).onclick = () => abrirCameraFoto((dados) => { fotoNova = dados; fotoRemover = false; fotoEl.removeAttribute('data-img'); fotoEl.innerHTML = '<img alt="" src="' + dados + '">'; });
    $('[data-cr-foto-rm]', el).onclick = () => { fotoNova = null; fotoRemover = true; obj._img = ''; obj._img_url = ''; fotoEl.removeAttribute('data-img'); fotoEl.innerHTML = ico('precos'); };
  }
  const condicionais = () => { const tipo = sels.tipo ? sels.tipo.valor : obj.tipo; cfg.campos.forEach((c) => { if (c[4]) { const w = $('#w-' + c[0], el) || $('#cr-' + c[0], el).closest('.field'); if (w) w.hidden = !c[4]({ tipo }); } }); };
  cfg.campos.forEach((c) => {
    const [k, rot, tipo, op] = c, v = obj[k] === undefined || obj[k] === null ? '' : obj[k];
    let ops = null;
    if (tipo === 'opcoes') ops = op.map((x) => ({ valor: x[0], rotulo: x[1] }));
    if (tipo === 'cat') ops = [{ valor: '', rotulo: 'Nenhuma' }].concat(opcoesCategorias());
    if (tipo === 'conta') ops = [{ valor: '', rotulo: 'Nenhuma' }].concat(opcoesContas());
    if (tipo === 'unidade') ops = (S.boot.unidades && S.boot.unidades.length ? S.boot.unidades : [{ codigo: 'un', nome: 'Unidade' }, { codigo: 'kg', nome: 'Quilo' }, { codigo: 'g', nome: 'Grama' }, { codigo: 'L', nome: 'Litro' }, { codigo: 'ml', nome: 'Mililitro' }]).map((u) => ({ valor: u.codigo, rotulo: u.nome, meta: u.codigo }));
    if (ops) sels[k] = seletor(el, '#cr-' + k, { opcoes: ops, valor: v || (tipo === 'opcoes' ? op[0][0] : tipo === 'unidade' ? 'un' : ''), rotulo: rot, aoMudar: condicionais });
  });
  condicionais();
  $('[data-cr-ok]', el).onclick = (e) => {
    const k0 = cfg.campos.find((c) => c[2] !== 'imagem')[0];
    if (!erroCampo(el, 'cr-' + k0, val(el, '#cr-' + k0).trim() ? '' : 'Campo obrigatório')) return;
    ocupado(e.currentTarget, async () => {
      const o = Object.assign({}, obj);
      cfg.campos.forEach((c) => {
        const [k, , tipo] = c, sel = '#cr-' + k;
        if (tipo === 'imagem') return;
        if (sels[k]) o[k] = sels[k].valor;
        else if (tipo === 'sim') o[k] = $(sel, el).checked ? 'SIM' : 'NAO';
        else if (tipo === 'moeda') { const t = $(sel + ' .money__input', el).value; o[k] = t === '' ? '' : num(t); }
        else if (tipo === 'numero' || tipo === 'dia') { const t = val(el, sel); o[k] = t === '' ? '' : num(t); }
        else o[k] = val(el, sel);
      });
      delete o._img; delete o._img_url; delete o._foto;
      const salvo = await api('crud.save', { entity, obj: o, _rid: m.rid });
      const pid = (salvo && salvo.id) || obj.id;
      if (entity === 'Produtos' && pid) {
        try {
          if (fotoNova) { await api('produto.imagem.salvar', { produto_id: pid, dados: fotoNova, origem: 'foto' }); delete IMG[pid]; }
          else if (fotoRemover && obj.id) { await api('produto.imagem.remover', { produto_id: pid }); delete IMG[pid]; }
          else if (obj._img_url && novo) { const bl = await (await fetch(obj._img_url)).blob(); await api('produto.imagem.salvar', { produto_id: pid, dados: await reduzirImagem(bl), origem: 'openfoodfacts' }); delete IMG[pid]; }
        } catch (e2) { toast('Produto salvo, mas a foto não pôde ser guardada.', { tipo: 'danger' }); }
      }
      m.close(); toast('Salvo'); await refreshBoot(); if (done) done();
    });
  };
  if (!novo) $('[data-cr-del]', el).onclick = async () => {
    if (!await confirmar({ titulo: 'Excluir este cadastro?', texto: 'Lançamentos antigos continuam.' })) return;
    run(async () => { await api('crud.delete', { entity, id: obj.id, versao: obj.versao }); m.close(); toast('Excluído'); await refreshBoot(); if (done) done(); });
  };
}

async function iniciar() {
  const ws = lembrar('fin_ws');
  if (ws) {
    S.ws = ws;
    const [l, b, d] = await Promise.allSettled([api('ws.listar'), api('bootstrap'), api('dashboard', { mes: isoLocal(new Date()).substr(0, 7) })]);
    const login = [l, b, d].find((x) => x.status === 'rejected' && x.reason && (x.reason.codigo === 'LOGIN' || x.reason.codigo === 'DESATIVADO'));
    if (login) throw login.reason;
    if (l.status === 'fulfilled' && b.status === 'fulfilled' && l.value.espacos.some((e) => e.id === ws)) {
